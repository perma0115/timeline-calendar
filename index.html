<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイムラインカレンダー</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 読み込み時のちらつき防止：テーマを先に決める
    (function () {
      var t = 'dark';
      try {
        var p = new URLSearchParams(location.search.replace(/^\?/, '') + '&' + location.hash.replace(/^#/, ''));
        var saved = JSON.parse(localStorage.getItem('tlcal.v1') || '{}') || {};
        t = (saved.prefs && saved.prefs.theme) || p.get('theme') || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <div id="minical" class="minical"></div>
      <div class="side-section">
        <div class="side-title">カレンダー</div>
        <ul id="callist" class="callist"></ul>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="tb-group">
          <button id="btn-sidebar" class="icon-btn" title="サイドバーの表示切替">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 3v10" stroke="currentColor" stroke-width="1.3"/></svg>
          </button>
          <button id="btn-today" class="btn" title="今日（T）">今日</button>
          <div class="tb-nav">
            <button id="btn-prev" class="icon-btn" title="前へ（←）">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-next" class="icon-btn" title="次へ（→）">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div id="range-label" class="range-label"></div>
          <span id="badge" class="badge" hidden>デモ表示中</span>
        </div>
        <div class="tb-group">
          <div class="seg" id="seg-view" role="group" aria-label="表示期間">
            <button data-v="day">日</button><button data-v="week">週</button><button data-v="2week">2週</button>
          </div>
          <div class="seg" id="seg-zoom" role="group" aria-label="表示の幅">
            <button data-z="S" title="画面に合わせる">小</button><button data-z="M">中</button><button data-z="L">大</button>
          </div>
          <button id="btn-refresh" class="icon-btn" title="最新の状態に更新">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13.2 8A5.2 5.2 0 1 1 11.6 4.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12.2 1.8v2.9H9.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-new" class="btn primary" title="新しい予定（N）">＋ 予定</button>
          <button id="btn-settings" class="icon-btn" title="設定">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 4.5h6.5M12.5 4.5h1M2.5 11.5h1M7 11.5h6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10.75" cy="4.5" r="1.75" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.25" cy="11.5" r="1.75" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>
      </header>

      <div id="tl-scroll" class="tl-scroll"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
